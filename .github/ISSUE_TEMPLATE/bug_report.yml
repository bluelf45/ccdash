name: Bug report
description: Something ccdash draws, reads or does is wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead. A screenshot of the
        screen helps for anything about the layout.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      description: The output of `ccdash --version`
      placeholder: ccdash 0.1.0
    validations:
      required: true

  - type: textarea
    id: doctor
    attributes:
      label: ccdash --doctor
      description: The whole output, settings table included. It says what ccdash can see and
        where each setting came from.
      render: text
    validations:
      required: true

  - type: input
    id: terminal
    attributes:
      label: Terminal and multiplexer
      description: Terminal emulator, and tmux/screen/zellij if you run one
      placeholder: kitty 0.42, tmux 3.5a
    validations:
      required: true

  - type: checkboxes
    id: agents
    attributes:
      label: Agents you use
      options:
        - label: Claude Code
        - label: Codex CLI
        - label: opencode
    validations:
      required: true
