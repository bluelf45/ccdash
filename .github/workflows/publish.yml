# Publishing a GitHub release puts that version on PyPI. Needs a trusted
# publisher on pypi.org first: project ccdash, this repo, workflow
# publish.yml, environment pypi.
name: publish
on:
  release:
    types: [published]

jobs:
  pypi:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - run: python ccdash.py --selftest
      - run: pip install build && python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
